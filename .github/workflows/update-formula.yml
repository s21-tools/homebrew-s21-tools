name: update formula

on:
  repository_dispatch:
    types: [formula-update]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: checkout tap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: update formula
        env:
          FORMULA: ${{ github.event.client_payload.formula }}
          VERSION: ${{ github.event.client_payload.version }}
          URL: ${{ github.event.client_payload.url }}
          SHA256: ${{ github.event.client_payload.sha256 }}
        run: |
          set -e

          FILE="Formula/${FORMULA}.rb"

          echo "updating $FILE"
          echo "formula: $FORMULA"
          echo "version: $VERSION"
          echo "url: $URL"
          echo "sha256: $SHA256"

          test -n "$FORMULA" || { echo "ERROR: FORMULA is empty"; exit 1; }
          test -n "$VERSION" || { echo "ERROR: VERSION is empty"; exit 1; }
          test -n "$URL" || { echo "ERROR: URL is empty"; exit 1; }
          test -n "$SHA256" || { echo "ERROR: SHA256 is empty"; exit 1; }
          test -f "$FILE" || { echo "ERROR: $FILE not found"; exit 1; }

          sed -i.bak "s|^[[:space:]]*url \".*\"|  url \"${URL}\"|" "$FILE"
          sed -i.bak "s|^[[:space:]]*sha256 \".*\"|  sha256 \"${SHA256}\"|" "$FILE"
          rm -f "$FILE.bak"

          git diff

      - name: commit and push
        env:
          FORMULA: ${{ github.event.client_payload.formula }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "Formula/${FORMULA}.rb"

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "${FORMULA} v${VERSION}"
          git push origin HEAD:main
