name: update formula

on:
  repository_dispatch:
    types: [formula-update]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: checkout tap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: update formula
        env:
          FORMULA: ${{ github.event.client_payload.formula }}
          VERSION: ${{ github.event.client_payload.version }}
          URL: ${{ github.event.client_payload.url }}
          SHA256: ${{ github.event.client_payload.sha256 }}
        run: |
          set -e

          FILE="Formula/${FORMULA}.rb"

          echo "updating $FILE"
          echo "  formula: $FORMULA"
          echo "  version: $VERSION"
          echo "  url:     $URL"
          echo "  sha256:  $SHA256"

          if [ -z "$FORMULA" ]; then
            echo "ERROR: FORMULA is empty"
            exit 1
          fi

          if [ -z "$VERSION" ]; then
            echo "ERROR: VERSION is empty"
            exit 1
          fi

          if [ -z "$URL" ]; then
            echo "ERROR: URL is empty"
            exit 1
          fi

          if [ -z "$SHA256" ]; then
            echo "ERROR: SHA256 is empty"
            exit 1
          fi

          if [ ! -f "$FILE" ]; then
            echo "ERROR: file $FILE not found"
            exit 1
          fi

          sed -i "s|url \".*\"|url \"${URL}\"|" "$FILE"
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" "$FILE"

          echo "Git diff:"
          git diff

      - name: commit and push
        env:
          FORMULA: ${{ github.event.client_payload.formula }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "Formula/${FORMULA}.rb"

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "${FORMULA} v${VERSION}"
          git push
